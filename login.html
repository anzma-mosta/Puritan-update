<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | بيوريتان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fcfcfc;
        }

        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 120px);
            padding: 40px 20px;
        }

        .auth-card {
            background: #fff;
            width: 100%;
            max-width: 550px;
            padding: 50px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.02);
            border-radius: 4px;
        }

        .auth-title {
            font-size: 32px;
            font-weight: 700;
            color: #333e48;
            margin-bottom: 40px;
            text-align: right;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 15px;
            color: #666;
            font-weight: 400;
        }

        .form-group input {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid #ebebeb;
            border-radius: 4px;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
            font-size: 16px;
            background-color: #fff;
        }

        .form-group input:focus {
            border-color: #004785;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            cursor: pointer;
        }

        .remember-me input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-password {
            color: #98c628;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .auth-actions {
            display: flex;
            justify-content: flex-end;
        }

        .auth-btn {
            background: #004785;
            color: #fff;
            border: none;
            padding: 10px 35px;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .auth-btn:hover {
            background: #003563;
        }

        .auth-switch {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }

        .auth-switch a {
            color: #004785;
            font-weight: 700;
        }

        @media (max-width: 640px) {
            .auth-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <!-- Simple Header -->
    <header class="main-header" style="background: #004785; padding: 15px 0;">
        <div class="container" style="display: flex; justify-content: center;">
            <a href="index.html" class="logo">
                <img src="https://shop.usa-4u.eu/media/wysiwyg/infortis/brands/puritan-s-pride.png" alt="بيوريتانز برايد" style="height: 60px;">
            </a>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card animate__animated animate__fadeIn">
            <h1 class="auth-title">تسجيل الدخول</h1>

            <form id="loginForm">
                <div class="form-group">
                    <label for="phone">رقم الهاتف</label>
                    <input type="text" id="phone" placeholder="أدخل رقم الهاتف" required>
                </div>
                <div class="form-group">
                    <label for="password">كلمه المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>

                <div class="form-options">
                    <a href="#" class="forgot-password">هل نسيت كلمه المرور؟</a>
                    <label class="remember-me">
                        <input type="checkbox">
                        <span>تذكرنى</span>
                    </label>
                </div>

                <div class="auth-actions">
                    <button type="submit" class="auth-btn">دخول</button>
                </div>
            </form>

            <div class="auth-switch">
                ليس لديك حساب؟ <a href="register.html">سجل الآن</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;

            // Get users from localStorage
            const users = JSON.parse(localStorage.getItem('users')) || [];

            // Find user by phone (since user image shows phone as primary login)
            const user = users.find(u => u.phone === phone && u.password === password);

            if (user) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', JSON.stringify(user));

                Swal.fire({
                    icon: 'success',
                    title: 'تم تسجيل الدخول!',
                    text: `مرحباً بك مجدداً، ${user.firstName}`,
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = 'index.html';
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'خطأ!',
                    text: 'رقم الهاتف أو كلمة المرور غير صحيحة',
                    confirmButtonText: 'حاول مرة أخرى'
                });
            }
        });
    </script>
</body>

</html>
