<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل جديد | بيوريتان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fcfcfc;
        }

        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 120px);
            padding: 40px 20px;
        }

        .auth-card {
            background: #fff;
            width: 100%;
            max-width: 650px;
            padding: 50px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.02);
            border-radius: 4px;
        }

        .auth-title {
            font-size: 32px;
            font-weight: 700;
            color: #333e48;
            margin-bottom: 40px;
            text-align: right;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 15px;
            color: #666;
            font-weight: 400;
        }

        .form-group input {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid #ebebeb;
            border-radius: 4px;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
            font-size: 16px;
            background-color: #fff;
        }

        .form-group input:focus {
            border-color: #004785;
        }

        .auth-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .auth-btn {
            background: #004785;
            color: #fff;
            border: none;
            padding: 10px 35px;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .auth-btn:hover {
            background: #003563;
        }

        .auth-switch {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }

        .auth-switch a {
            color: #004785;
            font-weight: 700;
        }

        .error-message {
            color: #ef4444;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        @media (max-width: 640px) {
            .auth-card {
                padding: 30px 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Simple Header -->
    <header class="main-header" style="background: #004785; padding: 15px 0;">
        <div class="container" style="display: flex; justify-content: center;">
            <a href="index.html" class="logo">
                <img src="https://www.puritanspride.com.eg/setting/store_img_1586269025.png" alt="بيوريتانز برايد" style="height: 60px;">
            </a>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card animate__animated animate__fadeIn">
            <h1 class="auth-title">تسجيل جديد</h1>

            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">الاسم الاول *</label>
                        <input type="text" id="firstName" placeholder="الاسم الأول" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">الاسم الاخير *</label>
                        <input type="text" id="lastName" placeholder="الاسم الأخير" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">رقم الهاتف *</label>
                    <input type="text" id="phone" placeholder="أدخل رقم الهاتف" required>
                </div>

                <div class="form-group">
                    <label for="email">البريد الالكترونى</label>
                    <input type="email" id="email" placeholder="أدخل البريد الإلكتروني" required>
                </div>

                <div class="form-group">
                    <label for="password">كلمه المرور *</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">تأكيد *</label>
                    <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور" required minlength="6">
                    <p class="error-message" id="passwordError">كلمات المرور غير متطابقة</p>
                </div>

                <div class="auth-actions">
                    <button type="submit" class="auth-btn">تسجيل</button>
                </div>
            </form>

            <div class="auth-switch">
                لديك حساب بالفعل؟ <a href="login.html">دخول</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const passwordError = document.getElementById('passwordError');

            if (password !== confirmPassword) {
                passwordError.style.display = 'block';
                return;
            } else {
                passwordError.style.display = 'none';
            }

            // Get existing users
            const users = JSON.parse(localStorage.getItem('users')) || [];

            // Check if phone or email already exists
            if (users.find(u => u.phone === phone)) {
                Swal.fire({
                    icon: 'error',
                    title: 'خطأ!',
                    text: 'رقم الهاتف هذا مسجل مسبقاً',
                    confirmButtonText: 'حسناً'
                });
                return;
            }

            if (users.find(u => u.email === email)) {
                Swal.fire({
                    icon: 'error',
                    title: 'خطأ!',
                    text: 'البريد الإلكتروني هذا مسجل مسبقاً',
                    confirmButtonText: 'حسناً'
                });
                return;
            }

            // Add new user
            users.push({
                firstName,
                lastName,
                fullName: `${firstName} ${lastName}`,
                phone,
                email,
                password
            });

            localStorage.setItem('users', JSON.stringify(users));

            Swal.fire({
                icon: 'success',
                title: 'تم التسجيل بنجاح!',
                text: 'يمكنك الآن تسجيل الدخول بحسابك الجديد',
                confirmButtonText: 'الذهاب لتسجيل الدخول'
            }).then(() => {
                window.location.href = 'login.html';
            });
        });
    </script>
</body>

</html>
